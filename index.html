<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planning travaux</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1f2937;--mut:#6b7280;--line:#e5e7eb;--acc:#1d4ed8}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
header input.t{font-size:18px;font-weight:700;border:0;border-bottom:2px solid transparent;background:none;min-width:260px}
header input.t:hover,header input.t:focus{border-color:var(--line);outline:0}
.sp{flex:1}button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0}.seg button.on{background:var(--acc);color:#fff;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;padding:10px 20px;font-size:13px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:3px 10px 3px 6px}
.chip input[type=color]{width:22px;height:22px;border:0;padding:0;background:none;cursor:pointer}
.chip .wn{border:0;background:none;font:inherit;min-width:6ch}.chip .wn:focus{outline:1px solid var(--acc);border-radius:4px}
.chip label{font-size:11px;color:var(--mut);cursor:pointer;display:flex;align-items:center;gap:2px}
.chip .x{color:#cbd5e1;cursor:pointer}.chip .x:hover{color:#dc2626}
#plegend{display:none}
.hint{padding:0 20px 8px;color:var(--mut);font-size:13px}
.wrap{margin:0 20px 30px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:0;text-align:center}
th{background:#f9fafb;font-size:12px;padding:6px 4px;position:sticky;top:0}
.wx{color:#cbd5e1;cursor:pointer;margin-left:5px;font-weight:400}.wx:hover{color:#dc2626}
td.site{position:sticky;left:0;background:#fff;text-align:left;padding:6px 10px;font-weight:600;min-width:170px;z-index:1;border-right:1px solid var(--line)}
td.site .x{float:right;color:#cbd5e1;cursor:pointer;font-weight:400}td.site .x:hover{color:#dc2626}
td.av{min-width:120px;padding:6px 8px}
.bar{height:10px;background:#e5e7eb;border-radius:6px;overflow:hidden}.bar b{display:block;height:100%;background:#16a34a;transition:width .2s}
.pct{font-size:11px;color:var(--mut)}
select.st{appearance:none;-webkit-appearance:none;border:0;border-radius:12px;padding:4px 10px;font:600 12px system-ui;text-align:center;cursor:pointer;color:#fff}
.s0{background:#9ca3af}.s1{background:#2563eb}.s2{background:#16a34a}.s3{background:#dc2626}
td.cm{min-width:170px;text-align:left;padding:4px 8px}td.cm input{width:100%;border:0;background:none;font:inherit;color:var(--mut)}td.cm .ct{display:none}
td.w{min-width:120px;vertical-align:top;cursor:pointer;border-left:1px solid var(--line);padding:3px}
td.w:hover{background:#eff6ff}
.cell{display:flex;flex-direction:column;align-items:flex-start;height:100%;min-height:26px;gap:3px;border-radius:4px}
.cell span{font:600 11px/1.25 system-ui;padding:3px 9px;border-radius:14px;text-align:left;white-space:normal;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.cell.empty{border:1px dashed #e5e7eb}
#pop{position:fixed;display:none;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:10px;z-index:50;min-width:290px}
#pop h4{margin:0 0 8px;font-size:13px}#pop label{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:6px;cursor:pointer}
#pop label:hover{background:#f3f4f6}#pop input[type=checkbox]{width:17px;height:17px}#pop i{width:12px;height:12px;border-radius:3px}
#pop .r{padding:2px 0}#pop .sub{display:none;gap:6px;margin:0 0 4px 36px}
#pop .lb{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:inherit}
#pop .q{width:56px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:inherit}
#pop .ok{margin-top:6px;width:100%}
#ptitle,.pfoot{display:none}
@media print{
 @page{size:A4 landscape;margin:10mm}
 body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 header,.hint,.noprint,td.site .x,#pop{display:none!important}
 .wrap{margin:0;border:0;overflow:visible}td.site,th{position:static}
 #ptitle{display:block;margin:0 0 6px}#ptitle h1{margin:0;font-size:20px}#ptitle p{margin:2px 0 0;color:var(--mut)}
 #plegend{display:flex!important;padding:6px 0}.pfoot{display:block;color:var(--mut);font-size:11px;margin-top:6px}
 td.cm{min-width:0;max-width:220px;vertical-align:top}td.cm input{display:none}td.cm .ct{display:block;white-space:pre-wrap;font-size:11px;color:var(--ink)}
 td.w{cursor:default}.cell.empty{border:0}tr{break-inside:avoid}
}
</style></head><body>
<header>
 <input class="t" id="title" value="Planning travaux" aria-label="Titre">
 <input class="t" id="client" value="" placeholder="Client / projet" style="font-size:15px;font-weight:500;min-width:200px">
 <div class="seg noprint"><button id="y2026" onclick="setYear(2026)">2026</button><button id="y2027" onclick="setYear(2027)">2027</button></div>
 <span class="sp"></span>
 <span id="sync" class="noprint" style="font-size:12px;color:#6b7280">Connexion…</span>
 <button onclick="addSite()">+ Site</button>
 <button onclick="addWeek()">+ Semaine</button>
 <button class="p" onclick="window.print()">⬇ Télécharger le Gantt (PDF)</button>
</header>
<div class="hint noprint">Cliquez sur une case (site × semaine) pour choisir les travaux. Dans la légende : changez la couleur ou le nom, ajoutez/supprimez un travail ; « % » = compte dans l'avancement. ✕ à côté d'une semaine la supprime.</div>
<div id="ptitle"><h1 id="pt"></h1><p id="pc"></p></div>
<div class="legend noprint" id="legend"></div>
<div class="legend" id="plegend"></div>
<div class="wrap"><table id="tbl"></table></div>
<div class="pfoot" id="pf"></div>
<div id="pop"></div>
<script>
const DEFW=[["Génie civil","#8d6e63",1],["Pose des coffrets Tetradis","#f59e0b",1],["Mes Losange","#2563eb",1],["Trx Enedis","#16a34a",1],["Mes Enedis","#84cc16",1],["Pose des caméras","#a855f7",1],["Autre","#64748b",0]];
const PAL=["#ef4444","#0ea5e9","#ec4899","#14b8a6","#f97316","#6366f1"];
const ST=["A planifier","En cours","Terminé","Bloqué"];
const SITES=["AUTREY","BAZIEN","BULT","CLEZENTAINE","DEINVILLERS","DOMPTAIL","DONCIERES","FAUCONCOURT","HARDANCOURT","HOUSSERAS","JEANMENIL","MENARMONT","MENIL SUR BELVITTE","MOYEMONT","NOSSONCOURT","ORTONCOURT","ST BENOIT LA CHIPOTTE","ST GENEST","ST GORGON","ST MAURICE SUR MORTAGNE","STE BARBE","VOMECOURT","XAFEVILLERS"];
let S={title:"Planning travaux",client:"",sites:SITES.map(n=>({n,st:0,c:""}))};
try{const j=localStorage.getItem("planTrav");if(j)S=JSON.parse(j)}catch(e){}
let year=2026;try{year=+localStorage.getItem("planYear")||2026}catch(e){}if(year!==2027)year=2026;
function norm(){
 if(!S.works)S.works=DEFW.map((d,i)=>({id:i,name:d[0],color:d[1],count:!!d[2]}));
 if(!S.wk){S.wk={"2026":S.weeks||[43,44,45,46,47,48,49,50]};delete S.weeks}
 if(!S.wk[2026])S.wk[2026]=[];
 if(!S.wk[2027])S.wk[2027]=[1,2,3,4,5,6,7,8];
 S.sites.forEach(s=>{
  if(!s.pp){s.pp={"2026":s.p||{}};delete s.p}
  if(!s.pp[2026])s.pp[2026]={};if(!s.pp[2027])s.pp[2027]={};
  Object.values(s.pp).forEach(py=>Object.keys(py).forEach(w=>{py[w]=py[w].map(o=>typeof o==="number"?{k:o,t:"",q:""}:o)}));
 });
}
norm();
let saveT=null,pendingRemote=null,cur=null;
function setSync(t,c){const e=document.getElementById("sync");e.textContent=t;e.style.color=c}
function save(){
 try{localStorage.setItem("planTrav",JSON.stringify(S))}catch(e){}
 if(window.cloud){setSync("Enregistrement…","#b45309");clearTimeout(saveT);saveT=setTimeout(()=>window.cloud.push(JSON.stringify(S)),400)}
}
function applyRemote(str){try{S=JSON.parse(str);norm();try{localStorage.setItem("planTrav",str)}catch(e){}render()}catch(e){}}
window.onRemote=str=>{
 const a=document.activeElement;
 if(cur||(a&&a.matches&&a.matches("input,select,textarea"))){pendingRemote=str;return}
 applyRemote(str)};
function flushRemote(){const a=document.activeElement;if(pendingRemote&&!cur&&!(a&&a.matches&&a.matches("input,select,textarea"))){const p=pendingRemote;pendingRemote=null;applyRemote(p)}}
document.addEventListener("focusout",()=>setTimeout(flushRemote,50));

const esc=x=>String(x==null?"":x).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const wk=k=>S.works.find(w=>w.id===k);
const ink=h=>{const n=parseInt(h.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return .299*r+.587*g+.114*b>160?"#1f2937":"#fff"};
const lab=o=>(o.t||wk(o.k).name)+(o.q?" x"+o.q:"");
const prog=s=>{const ids=new Set(S.works.filter(x=>x.count).map(x=>x.id));if(!ids.size)return 0;const u=new Set();
 Object.values(s.pp).forEach(py=>Object.values(py).forEach(a=>a.forEach(o=>{if(ids.has(o.k))u.add(o.k)})));return Math.round(u.size/ids.size*100)};
const PP=s=>s.pp[year]||(s.pp[year]={});

function renderPLegend(){plegend.innerHTML=S.works.map(x=>`<span><i style="background:${x.color}"></i>${esc(x.name)}</span>`).join("")}
function renderLegend(){
 legend.innerHTML=S.works.map(x=>`<span class="chip"><input type="color" value="${x.color}" title="Couleur" oninput="setW(${x.id},'color',this.value)"><input class="wn" value="${esc(x.name)}" style="width:${Math.max(6,x.name.length+1)}ch" oninput="this.style.width=Math.max(6,this.value.length+1)+'ch';setW(${x.id},'name',this.value)"><label title="Compte dans l'avancement théorique"><input type="checkbox" ${x.count?"checked":""} onchange="setW(${x.id},'count',this.checked)">%</label><span class="x" onclick="delW(${x.id})" title="Supprimer ce travail">✕</span></span>`).join("")+`<button onclick="addW()">+ Travail</button>`;
 renderPLegend();
}
function renderTable(){
 const wks=(S.wk[year]||[]).slice().sort((a,b)=>a-b);
 let h=`<tr><th style="text-align:left;padding-left:10px">Site</th><th>Avancement théorique</th><th>Statut</th><th class="cm">Commentaires</th>`+
  wks.map(w=>`<th>Sem ${w}<span class="wx noprint" onclick="delWeek(${w})" title="Supprimer la semaine">✕</span></th>`).join("")+`</tr>`;
 S.sites.forEach((s,i)=>{
  const p=prog(s),pp=PP(s);
  h+=`<tr><td class="site">${esc(s.n)}<span class="x noprint" onclick="delSite(${i})" title="Supprimer">✕</span></td>
  <td class="av"><div class="bar"><b style="width:${p}%"></b></div><div class="pct">${p}%</div></td>
  <td><select class="st s${s.st}" onchange="S.sites[${i}].st=+this.value;save();renderTable()">${ST.map((x,k)=>`<option value="${k}" ${k==s.st?"selected":""}>${x}</option>`).join("")}</select></td>
  <td class="cm"><input value="${esc(s.c)}" oninput="S.sites[${i}].c=this.value;this.nextElementSibling.textContent=this.value;save()" placeholder="…"><span class="ct">${esc(s.c)}</span></td>`+
  wks.map(w=>{const a=(pp[w]||[]).filter(o=>wk(o.k));
   return `<td class="w" onclick="openPop(event,${i},${w})"><div class="cell ${a.length?"":"empty"}">${a.map(o=>{const x=wk(o.k);return `<span style="background:${x.color};color:${ink(x.color)}">${esc(lab(o))}</span>`}).join("")}</div></td>`}).join("")+`</tr>`;
 });
 tbl.innerHTML=h;
 pt.textContent=S.title;pc.textContent=[S.client,"Année "+year].filter(Boolean).join(" — ");
 pf.textContent="Planning prévisionnel — édité le "+new Date().toLocaleDateString("fr-FR");
 [2026,2027].forEach(y=>document.getElementById("y"+y).classList.toggle("on",y===year));
}
function render(){title.value=S.title;client.value=S.client;renderLegend();renderTable()}

function setYear(y){year=y;try{localStorage.setItem("planYear",y)}catch(e){}closePop();renderTable()}
function setW(id,key,val){const x=wk(id);if(!x)return;x[key]=val;save();renderPLegend();renderTable()}
function addW(){
 closePop();const id=S.works.reduce((m,w)=>Math.max(m,w.id),-1)+1;
 S.works.push({id,name:"Nouveau travail",color:PAL[id%PAL.length],count:true});
 save();renderLegend();renderTable();
 setTimeout(()=>{const e=[...legend.querySelectorAll(".wn")].pop();if(e){e.focus();e.select()}},0);
}
function delW(id){
 const x=wk(id);let n=0;
 S.sites.forEach(s=>Object.values(s.pp).forEach(py=>Object.values(py).forEach(a=>{if(a.some(o=>o.k===id))n++})));
 if(!confirm("Supprimer « "+x.name+" » ?"+(n?"\n"+n+" case(s) planifiée(s) seront aussi modifiées.":"")))return;
 S.works=S.works.filter(w=>w.id!==id);
 S.sites.forEach(s=>Object.values(s.pp).forEach(py=>Object.keys(py).forEach(w=>{py[w]=py[w].filter(o=>o.k!==id);if(!py[w].length)delete py[w]})));
 closePop();save();renderLegend();renderTable();
}
function addWeek(){
 const wks=S.wk[year],mx=year===2026?53:52,nx=Math.min(mx,(wks.length?Math.max(...wks):0)+1);
 const v=prompt("Numéro de la semaine à ajouter (1 à "+mx+") ?",nx);if(v===null)return;
 const n=parseInt(v);if(!(n>=1&&n<=mx)){alert("Numéro invalide");return}
 if(wks.includes(n)){alert("Cette semaine existe déjà");return}
 wks.push(n);wks.sort((a,b)=>a-b);save();renderTable();
}
function delWeek(w){
 if(!confirm("Supprimer la semaine "+w+" ("+year+") et les travaux qui y sont planifiés ?"))return;
 S.wk[year]=S.wk[year].filter(x=>x!==w);
 S.sites.forEach(s=>{delete PP(s)[w]});
 closePop();save();renderTable();
}
function addSite(){const n=prompt("Nom du site ?");if(n){S.sites.push({n:n.toUpperCase(),st:0,c:"",pp:{"2026":{},"2027":{}}});save();renderTable()}}
function delSite(i){if(confirm("Supprimer "+S.sites[i].n+" ?")){S.sites.splice(i,1);save();renderTable()}}

function buildPop(){
 const s=S.sites[cur.i],a=PP(s)[cur.w]||[];
 pop.innerHTML=`<h4>${esc(s.n)} — Sem ${cur.w} (${year})</h4>`+S.works.map(x=>{const o=a.find(o=>o.k===x.id);
  return `<div class="r"><label><input type="checkbox" data-k="${x.id}" ${o?"checked":""}><i style="background:${x.color}"></i>${esc(x.name)}</label>
  <div class="sub" style="display:${o?"flex":"none"}"><input class="lb" data-k="${x.id}" value="${esc(o?o.t:"")}" placeholder="${esc(x.name)}" title="Texte affiché (modifiable)"><input class="q" type="number" min="1" data-k="${x.id}" value="${esc(o?o.q:"")}" placeholder="x" title="Quantité (ex. 4 → x4)"></div></div>`}).join("")+`<button class="ok p" onclick="closePop()">OK</button>`;
}
function openPop(e,i,w){
 cur={i,w};buildPop();pop.style.display="block";
 const r=e.currentTarget.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight;
 pop.style.left=Math.max(8,Math.min(r.left,innerWidth-pw-8))+"px";
 pop.style.top=(r.bottom+ph+8>innerHeight?Math.max(8,r.top-ph-4):r.bottom+4)+"px";
 e.stopPropagation();
}
function closePop(){pop.style.display="none";cur=null;setTimeout(flushRemote,50)}
pop.addEventListener("change",e=>{
 const t=e.target;if(t.type!=="checkbox")return;
 const s=S.sites[cur.i],pp=PP(s),k=+t.dataset.k;let a=pp[cur.w]||[];
 if(t.checked){if(!a.some(o=>o.k===k))a.push({k,t:"",q:""});a.sort((x,y)=>x.k-y.k);pp[cur.w]=a}
 else{a=a.filter(o=>o.k!==k);if(a.length)pp[cur.w]=a;else delete pp[cur.w]}
 t.closest(".r").querySelector(".sub").style.display=t.checked?"flex":"none";
 if(t.checked&&k===1)t.closest(".r").querySelector(".q").focus();
 if(s.st==0&&prog(s)>0)s.st=1;
 save();renderTable();
});
pop.addEventListener("input",e=>{
 const t=e.target;if(!t.dataset.k||t.type==="checkbox")return;
 const o=(PP(S.sites[cur.i])[cur.w]||[]).find(o=>o.k===+t.dataset.k);if(!o)return;
 if(t.classList.contains("lb"))o.t=t.value;else o.q=t.value;
 save();renderTable();
});
document.addEventListener("click",e=>{if(cur&&!pop.contains(e.target))closePop()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"||(e.key==="Enter"&&cur&&e.target.tagName==="INPUT"))closePop()});
title.oninput=()=>{S.title=title.value;pt.textContent=S.title;save()};
client.oninput=()=>{S.client=client.value;renderTable();save()};
render();
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,doc,onSnapshot,setDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyDhb1JSLqfwdN4fddHpTS6opzV3fL9Zi3g",authDomain:"planning-free.firebaseapp.com",projectId:"planning-free",storageBucket:"planning-free.firebasestorage.app",messagingSenderId:"57310213062",appId:"1:57310213062:web:e35eab961ce631d699b8c7"});
const ref=doc(getFirestore(app),"plannings","main");
const err=e=>setSync(e&&e.code==="permission-denied"?"Accès refusé (règles Firestore)":"Hors ligne — non synchronisé","#dc2626");
window.cloud={push:async str=>{try{await setDoc(ref,{data:str,updated:Date.now()});setSync("● Synchronisé","#16a34a")}catch(e){err(e)}}};
onSnapshot(ref,snap=>{
 if(snap.metadata.hasPendingWrites)return;
 if(!snap.exists()){if(snap.metadata.fromCache)return;window.cloud.push(JSON.stringify(S));return}
 window.onRemote(snap.data().data);setSync("● Synchronisé","#16a34a");
},err);
</script>
</body></html>
